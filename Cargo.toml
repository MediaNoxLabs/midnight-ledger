[workspace]
package.license = "Apache-2.0"
package.repository = "https://github.com/midnightntwrk/midnight-ledger"
members = [
    "zswap",
    "ledger",
    "ledger-wasm",
    "proof-server",
    "onchain-runtime",
    "onchain-runtime-wasm",
    "onchain-state",
    "onchain-vm",
    "storage",
    "zkir",
    "zkir-v3",
    "zkir-wasm",
    "zkir-v3-wasm",
    "transient-crypto",
    "base-crypto",
    "base-crypto-derive",
    "coin-structure",
    "serialize",
    "serialize-macros",
    "generate-cost-model",
    "wasm-proving-demos/zkir-mt",
    "static",
    "storage-core"
]
default-members = [
    "zswap",
    "ledger",
    "onchain-runtime",
    "onchain-state",
    "onchain-vm",
    "storage",
    "zkir",
    "base-crypto",
    "base-crypto-derive",
    "transient-crypto",
    "coin-structure",
    "serialize",
    "serialize-macros",
    "generate-cost-model",
]
resolver = "2"
exclude = [
    "scripts/hardfork_version_patch"
]

# Pretty much every dependency is crypto.
# If there's one thing I know about it, it's that we don't want the molasses
# of unoptimized crypto.
[profile.dev.package."*"]
opt-level = 2
[profile.test.package."*"]
opt-level = 2

[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# Because we pull in older, crates.io versions of `transient-crypto`, we need
# to force these to resolve locally for a local build. These patches not being
# present in consumer builds is fine, as they don't/shouldn't *want* the local
# packages.
[patch.crates-io]
# Pinned to a rev, not a sibling `path`, on purpose.
#
# This line needs midnight-proofs `^0.8.1`, which only the patched
# 0.8.2 branch provides. A `path = "../midnight-zk/proofs"` pin means
# "whatever branch that checkout happens to be on" — and when that is
# `main-patched` (0.8.0) the requirement is unsatisfied, so cargo
# *drops the patch* with a warning and resolves the registry crate
# instead. The build then succeeds without any of the optimisations,
# which is the worst possible failure: silent.
#
# MediaNoxLabs/midnight-zk @ proofs-0.8-patched. To iterate locally,
# add a `paths = ["../midnight-zk/proofs"]` override in your own
# `.cargo/config.toml` rather than editing this line.
midnight-proofs = { git = "https://github.com/MediaNoxLabs/midnight-zk", rev = "b290c8996bfc5ed2ad10a8fd1adabbcf0a62d813" }
midnight-base-crypto = { path = "base-crypto" }
midnight-serialize = { path = "serialize" }
# Because we rely on additions in 2.2
midnight-transient-crypto-old = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "transient-crypto-2.2.0-rc.1", package = "midnight-transient-crypto" }

[workspace.metadata.spellcheck]
config = ".spellcheck/cargo-spellcheck.toml"
