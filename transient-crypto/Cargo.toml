[package]
name = "midnight-transient-crypto"
version = "3.0.0"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "Cryptographic primitives for Midnight that may change over time."

[features]
default = []
cli = ["base-crypto/cli"]
proptest = [
  "dep:proptest",
  "dep:proptest-derive",
  "base-crypto/proptest",
  "serialize/proptest",
  "storage-core/proptest",
]
mock-verify = []
public-internal-structure = []

[dependencies]
base-crypto = { version = "1.1.0", path = "../base-crypto", package = "midnight-base-crypto" }
derive = { version = "1.0.0", path = "../base-crypto-derive", package = "midnight-base-crypto-derive" }
serialize = { version = "1.0.0", path = "../serialize", package = "midnight-serialize" }
storage-core = { version = "1.0.0", path = "../storage-core", package = "midnight-storage-core" }

ff = "^0.13.1"
group = "^0.13.0"
midnight-curves = { version = "^0.3.1" }
# Features are requested per-target below, not here: `disk-spill` (and
# the `mmap` it implies) are host-only in the patched fork and are a
# `compile_error!` on wasm. Asking for them unconditionally would break
# every wasm consumer in this workspace, because cargo features are
# additive across the whole graph.
midnight-proofs = { version = "^0.8.1" }
midnight-circuits = { version = "^7.2.2" }
midnight-zk-stdlib = { version = "^2.3.3" }
anyhow = { version = "^1.0.102" }
lru = "0.18.0"
# `memmap2` is declared per-target below, alongside the midnight-proofs
# features it pairs with — see the `cfg(not(target_family = "wasm"))`
# table. Declaring it here would put it in every wasm bundle for code
# that target cannot reach.
# Gzipped proving-key disk cache (mailbox 0009). The ledger-8 apply landed
# this; on ledger-9 the hunk was absorbed without it.
flate2 = "^1.1.2"

# rand 0.9.0 is not yet supported by some of our dependencies, we will
# stick with 0.8.0 for now.
rand = { version = "^0.8.4", features = ["getrandom"] }
lazy_static = "^1.5.0"
tracing = { version = "^0.1.41" }
const-hex = "^1.14.1"
sha2 = "^0.11.0"
k256 = "^0.13.4"
signature = "^2.2.0"
zeroize = "^1.8.0"

derive-where = "^1.6.1"
serde = { version = "^1.0.219", features = ["derive", "rc"] }
serde_bytes = { version = "^0.11.17" }
serde_json = { version = "^1.0.140" }
fake = { version = "^2.10.0", features = ["derive"] }
pastey = "0.2.1"
# proptest 1.7.0+ rely on rand 0.9.0, which we are not yet updating to.
proptest = { version = "~1.6.0", optional = true }
proptest-derive = { version = "0.8", optional = true }
blake2b_simd = "1.0.3"

futures = { version = "^0.3.31" }

# Host-only prover optimisations in the patched midnight-proofs.
#
# `disk-spill` implies `mmap`, and both are a `compile_error!` on wasm —
# deliberately, so a browser build fails loudly at compile time instead
# of panicking on first use of a mapped path. Requesting them per-target
# is what lets one workspace build both: native gets `read_mmap_arc`,
# `write_mmap_companion` and the coset spill; wasm gets a
# midnight-proofs with neither the code nor the `memmap2`/`tempfile`
# dependencies in its bundle.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
midnight-proofs = { version = "^0.8.1", features = ["disk-spill"] }
# `read_mmap_path` opens the companion SRS file via `memmap2` and hands
# the `Arc<Mmap>` to the patched midnight-proofs' `read_mmap_arc`. The
# companion lives in the app cache dir and the mapping is read-only.
# Lives in this table because it is exactly as host-only as the feature
# above: without `mmap` there is no `read_mmap_arc` to hand it to.
memmap2 = "0.9"

[dev-dependencies]
midnight-transient-crypto = { path = ".", features = ["proptest"] }
actix-rt = "^2.10.0"
rand_chacha = "^0.3.1"
tracing-subscriber = "0.3.19"
criterion = { version = "^0.5.1" }
rayon = "^1.10.0"

[[bench]]
name = "benchmarking"
harness = false

[[bench]]
name = "merkle_deserialize"
harness = false

[[example]]
name = "calibrate"
path = "examples/calibrate.rs"
required-features = ["mock-verify"]
